[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sapp-localization"
version = "0.1.0"
description = "Survey-inferred anchor point-process localization and paper reproduction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[project.optional-dependencies]
paper = ["matplotlib==3.10.1", "numba==0.62.1", "torch==2.5.1"]
cuda = ["matplotlib==3.10.1", "numba==0.62.1", "torch==2.5.1"]

[tool.uv]
conflicts = [[{extra = "paper"}, {extra = "cuda"}]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu", extra = "paper", marker = "sys_platform != 'darwin'"},
  {index = "pytorch-cu121", extra = "cuda", marker = "sys_platform != 'darwin'"},
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.14"]

[project.scripts]
sapp = "sapp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
